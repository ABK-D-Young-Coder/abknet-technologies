<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="../assets/images/abknet-logo.png"><link rel="stylesheet" href="../css/style.css"><title>ABKNET JSON Formatter — ABKNET TECHNOLOGIES</title><style>.tool-interface{margin-top:30px;border:1px solid var(--line);border-radius:24px;padding:25px;background:rgba(4,17,30,.82)}.tool-interface textarea,.tool-interface input,.tool-interface select{width:100%;background:#020b16;border:1px solid var(--line);color:#eefaff;border-radius:12px;padding:13px;outline:none}.tool-interface textarea{min-height:280px;resize:vertical}.tool-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.privacy-note{margin-top:18px;color:#6f8ca3;font-size:11px}</style></head><body>
<header class="site-header"><a class="brand" href="../index.html"><img src="../assets/images/abknet-logo.png" alt="ABKNET logo"><span><strong>ABKNET</strong><small>TECHNOLOGIES</small></span></a><button class="menu-toggle" aria-label="Open navigation">☰</button><nav class="nav"><a href="../index.html">Home</a><a href="index.html">Tools</a><a href="../downloads/index.html">Downloads</a><a href="../tutorials/index.html">Tutorials</a><a href="../projects/index.html">Projects</a><a href="../blog/index.html">Blog</a><a href="../youtube.html">YouTube</a><a href="../about/index.html">About</a><a href="../contact/index.html">Contact</a></nav></header>
<main><section class="section"><span class="eyebrow">ABKNET FREE TOOL</span><h1 style="font-size:clamp(42px,6vw,72px);line-height:1">ABKNET JSON Formatter</h1><p style="color:var(--muted);max-width:700px">Format, beautify and validate JSON directly in your browser.</p><div class="tool-interface"><textarea id="json" placeholder='Paste JSON here...'></textarea><div class="tool-actions"><button class="btn btn-primary" id="format">Format</button><button class="btn btn-ghost" id="validate">Validate</button><button class="btn btn-ghost" id="copy">Copy</button><button class="btn btn-ghost" id="download">Download</button><button class="btn btn-ghost" id="clear">Clear</button></div><p id="status" style="color:var(--muted)"></p></div><div class="privacy-note">✓ When this tool supports local processing, your data stays in your browser.</div></section></main><footer class="footer"><div class="footer-bottom"><span>© 2026 ABKNET TECHNOLOGIES</span><a href="../index.html">Back to home →</a></div></footer><script src="../js/app.js"></script><script>const j=document.querySelector("#json"),s=document.querySelector("#status");function parsed(){try{return JSON.parse(j.value)}catch(e){throw e}}
document.querySelector("#format").onclick=()=>{try{j.value=JSON.stringify(parsed(),null,2);s.textContent="Valid JSON — formatted successfully."}catch(e){s.textContent="Invalid JSON: "+e.message}};
document.querySelector("#validate").onclick=()=>{try{parsed();s.textContent="✓ Valid JSON"}catch(e){s.textContent="✕ Invalid JSON: "+e.message}};
document.querySelector("#copy").onclick=()=>navigator.clipboard.writeText(j.value).then(()=>s.textContent="Copied to clipboard.");
document.querySelector("#clear").onclick=()=>{j.value="";s.textContent=""};
document.querySelector("#download").onclick=()=>{const b=new Blob([j.value],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="abknet-data.json";a.click();URL.revokeObjectURL(a.href)};</script></body></html>
