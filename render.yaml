services:
  - type: web
    name: abknet-technologies-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: abknet-technologies-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://abknet.work.gd,https://www.abknet.work.gd,https://abk-d-young-coder.github.io

databases:
  - name: abknet-technologies-db
    databaseName: abknet
    user: abknet
    plan: free
